<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>渓流マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #0f1a0f;
    --surface: #1a2a1a;
    --surface2: #243224;
    --border: #2e4a2e;
    --accent: #4a9e5c;
    --accent2: #7ecf8e;
    --entry: #3a7fd4;
    --exit: #d45a3a;
    --catch: #f0c040;
    --text: #d0e8d0;
    --text2: #7aaa7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 1000;
  }
  #header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.05em; color: var(--accent2); }
  #header h1 span { font-size: 10px; color: var(--text2); display: block; font-weight: 400; letter-spacing: 0.1em; }
  #gps-status { font-size: 10px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
  #gps-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; transition: background 0.3s; }
  #gps-dot.active { background: var(--accent); animation: pulse 2s infinite; }
  #gps-dot.recording { background: var(--exit); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #map { flex: 1; z-index: 1; }
  #controls {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    flex-shrink: 0;
    z-index: 1000;
  }
  #track-info {
    display: none;
    background: var(--surface2);
    border: 1px solid var(--exit);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    color: var(--exit);
    margin-bottom: 8px;
    text-align: center;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  #track-info.show { display: block; }
  #pin-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .pin-btn {
    border: none; border-radius: 8px; padding: 10px 4px;
    font-size: 12px; font-weight: 700; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .pin-btn:active { transform: scale(0.95); }
  .pin-btn .icon { font-size: 18px; }
  #btn-catch { background: var(--catch); color: #1a1200; }
  #btn-entry { background: var(--entry); color: #fff; }
  #btn-exit  { background: var(--exit);  color: #fff; }
  #track-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .track-btn {
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 4px;
    font-size: 12px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    font-family: inherit; color: var(--text); background: var(--surface2);
  }
  .track-btn:active { transform: scale(0.97); }
  #btn-track-start { border-color: var(--accent); color: var(--accent); }
  #btn-track-start.recording { background: var(--exit); border-color: var(--exit); color: #fff; }
  #btn-clear { border-color: var(--border); color: var(--text2); }

  /* ログパネル */
  #log-panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0; padding: 16px;
    z-index: 2000; transform: translateY(100%);
    transition: transform 0.3s ease;
    max-height: 70dvh; overflow-y: auto;
  }
  #log-panel.open { transform: translateY(0); }
  #log-panel h2 { font-size: 14px; color: var(--accent2); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  #close-log { background: none; border: none; color: var(--text2); font-size: 18px; cursor: pointer; padding: 0 4px; font-family: inherit; }
  .log-item { border-bottom: 1px solid var(--border); padding: 10px 0; display: flex; align-items: flex-start; gap: 10px; }
  .log-badge { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
  .badge-catch { background: var(--catch); color: #1a1200; }
  .badge-entry { background: var(--entry); color: #fff; }
  .badge-exit  { background: var(--exit);  color: #fff; }
  .log-info { flex: 1; }
  .log-name { font-size: 13px; font-weight: 700; }
  .log-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .log-memo { font-size: 12px; color: var(--text); margin-top: 4px; }
  .log-jump { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--accent2); font-size: 11px; cursor: pointer; padding: 2px 6px; margin-top: 4px; font-family: inherit; }
  .log-delete { background: none; border: none; color: var(--text2); font-size: 16px; cursor: pointer; padding: 0 4px; font-family: inherit; flex-shrink: 0; }

  /* ログボタン */
  #btn-log {
    position: absolute; right: 14px; bottom: 130px; z-index: 1500;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 50%; width: 44px; height: 44px; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #log-count {
    position: absolute; top: -4px; right: -4px;
    background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
    border-radius: 50%; width: 16px; height: 16px;
    display: none; align-items: center; justify-content: center;
  }

  /* 現在地ボタン */
  #btn-myloc {
    position: absolute; right: 14px; bottom: 182px; z-index: 1500;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 50%; width: 44px; height: 44px; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  /* メモモーダル */
  #memo-modal {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 3000;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #memo-modal.open { display: flex; }
  #memo-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 340px; }
  #memo-box h3 { font-size: 14px; color: var(--accent2); margin-bottom: 12px; }
  #memo-box input, #memo-box textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: inherit;
    font-size: 14px; padding: 10px; margin-bottom: 10px;
  }
  #memo-box input { height: 40px; }
  #memo-box textarea { height: 80px; resize: none; }
  #memo-box input::placeholder, #memo-box textarea::placeholder { color: var(--text2); }
  #memo-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #memo-cancel { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text2); font-size: 13px; font-weight: 700; padding: 10px; cursor: pointer; font-family: inherit; }
  #memo-save { background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 700; padding: 10px; cursor: pointer; font-family: inherit; }

  /* Leafletカスタム */
  .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-color: var(--border) !important; }
  .leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  .leaflet-popup-tip { background: var(--surface); }
  .popup-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .popup-meta  { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .popup-memo  { font-size: 12px; }
</style>
</head>
<body>

<div id="header">
  <h1>渓流マップ<span>KEISYU MAP</span></h1>
  <div id="gps-status">
    <div id="gps-dot"></div>
    <span id="gps-label">GPS待機中</span>
  </div>
</div>

<div id="map"></div>

<button id="btn-myloc" onclick="goToMyLocation()" title="現在地へ">📍</button>
<button id="btn-log" onclick="openLog()">📋<span id="log-count"></span></button>

<div id="controls">
  <div id="track-info">● 軌跡記録中… <span id="track-points">0</span>ポイント</div>
  <div id="pin-row">
    <button class="pin-btn" id="btn-catch" onclick="startPin('catch')">
      <span class="icon">🎣</span>釣果ポイント
    </button>
    <button class="pin-btn" id="btn-entry" onclick="startPin('entry')">
      <span class="icon">🔵</span>入渓
    </button>
    <button class="pin-btn" id="btn-exit" onclick="startPin('exit')">
      <span class="icon">🔴</span>退渓
    </button>
  </div>
  <div id="track-row">
    <button class="track-btn" id="btn-track-start" onclick="toggleTracking()">
      <span id="track-btn-icon">⏺</span>
      <span id="track-btn-label">軌跡記録</span>
    </button>
    <button class="track-btn" id="btn-clear" onclick="clearAll()">
      🗑 全消去
    </button>
  </div>
</div>

<div id="log-panel">
  <h2>記録ログ <button id="close-log" onclick="closeLog()">✕</button></h2>
  <div id="log-list"></div>
</div>

<div id="memo-modal">
  <div id="memo-box">
    <h3 id="memo-title">ポイントを記録</h3>
    <input type="text" id="memo-name" placeholder="場所の名前（任意）">
    <textarea id="memo-text" placeholder="メモ・釣果など（任意）"></textarea>
    <div id="memo-buttons">
      <button id="memo-cancel" onclick="cancelPin()">キャンセル</button>
      <button id="memo-save"   onclick="savePin()">保存</button>
    </div>
  </div>
</div>

<script>
// 地図初期化
const map = L.map('map', { center: [42.6, 141.4], zoom: 10, zoomControl: true });

L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>',
  maxZoom: 18
}).addTo(map);

// データ
let pins = JSON.parse(localStorage.getItem('keisyu_pins') || '[]');
let savedTracks = JSON.parse(localStorage.getItem('keisyu_tracks') || '[]');
let isTracking = false;
let currentTrackPoints = [];
let currentTrackLine = null;
let currentLatLng = null;
let gpsReady = false;
let markers = [];
let trackLayers = [];
let currentPinType = null;
let myLocMarker = null;

// アイコン
function makeIcon(type) {
  const c = { catch:{e:'🎣',bg:'#f0c040',fg:'#1a1200'}, entry:{e:'🔵',bg:'#3a7fd4',fg:'#fff'}, exit:{e:'🔴',bg:'#d45a3a',fg:'#fff'} }[type];
  return L.divIcon({
    className: '',
    html: `<div style="background:${c.bg};width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.4);border:2px solid rgba(255,255,255,0.25)"><span style="transform:rotate(45deg);font-size:16px">${c.e}</span></div>`,
    iconSize: [34,34], iconAnchor: [17,34], popupAnchor: [0,-36]
  });
}

// GPS
navigator.geolocation && navigator.geolocation.watchPosition(
  pos => {
    gpsReady = true;
    currentLatLng = [pos.coords.latitude, pos.coords.longitude];
    document.getElementById('gps-dot').className = isTracking ? 'active recording' : 'active';
    document.getElementById('gps-label').textContent = `±${Math.round(pos.coords.accuracy)}m`;
    if (isTracking) {
      // 前のポイントと距離チェック（5m以上で追加）
      const last = currentTrackPoints[currentTrackPoints.length - 1];
      if (!last || calcDist(last, currentLatLng) > 5) {
        currentTrackPoints.push([...currentLatLng]);
        if (currentTrackLine) currentTrackLine.setLatLngs(currentTrackPoints);
        document.getElementById('track-points').textContent = currentTrackPoints.length;
      }
    }
    // 現在地マーカー更新
    if (!myLocMarker) {
      myLocMarker = L.circleMarker(currentLatLng, { radius:8, color:'#4a9e5c', fillColor:'#7ecf8e', fillOpacity:0.9, weight:2 }).addTo(map);
    } else {
      myLocMarker.setLatLng(currentLatLng);
    }
  },
  () => { document.getElementById('gps-label').textContent = 'エラー'; },
  { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
);

function calcDist(a, b) {
  const R = 6371000;
  const dLat = (b[0]-a[0]) * Math.PI/180;
  const dLng = (b[1]-a[1]) * Math.PI/180;
  return Math.sqrt(dLat*dLat + dLng*dLng) * R;
}

function goToMyLocation() {
  if (currentLatLng) map.setView(currentLatLng, 15);
  else alert('GPS取得中です。');
}

// ピン
function startPin(type) {
  if (!gpsReady || !currentLatLng) { alert('GPS取得中です。'); return; }
  currentPinType = type;
  const labels = { catch:'🎣 釣果ポイントを記録', entry:'🔵 入渓ポイントを記録', exit:'🔴 退渓ポイントを記録' };
  document.getElementById('memo-title').textContent = labels[type];
  document.getElementById('memo-name').value = '';
  document.getElementById('memo-text').value = '';
  document.getElementById('memo-modal').classList.add('open');
  setTimeout(() => document.getElementById('memo-name').focus(), 150);
}

function cancelPin() { document.getElementById('memo-modal').classList.remove('open'); currentPinType = null; }

function savePin() {
  if (!currentLatLng || !currentPinType) return;
  const now = new Date();
  const pin = {
    id: Date.now(), type: currentPinType,
    lat: currentLatLng[0], lng: currentLatLng[1],
    name: document.getElementById('memo-name').value.trim() || typeLabel(currentPinType),
    memo: document.getElementById('memo-text').value.trim(),
    date: now.toLocaleDateString('ja-JP'),
    time: now.toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'})
  };
  pins.push(pin);
  localStorage.setItem('keisyu_pins', JSON.stringify(pins));
  addMarker(pin);
  document.getElementById('memo-modal').classList.remove('open');
  map.setView(currentLatLng, Math.max(map.getZoom(), 14));
  currentPinType = null;
  updateLogCount();
}

function typeLabel(t) { return {catch:'釣果ポイント',entry:'入渓',exit:'退渓'}[t]||t; }

function addMarker(pin) {
  const m = L.marker([pin.lat, pin.lng], { icon: makeIcon(pin.type) }).addTo(map)
    .bindPopup(`<div class="popup-title">${pin.name}</div><div class="popup-meta">${pin.date} ${pin.time}</div>${pin.memo?`<div class="popup-memo">${pin.memo}</div>`:''}`);
  markers.push({ id: pin.id, marker: m });
}

// 軌跡
function toggleTracking() {
  if (!isTracking) {
    if (!gpsReady) { alert('GPS取得中です。'); return; }
    isTracking = true;
    currentTrackPoints = currentLatLng ? [[...currentLatLng]] : [];
    currentTrackLine = L.polyline(currentTrackPoints, { color:'#4a9e5c', weight:3, opacity:0.85, dashArray:'6,4' }).addTo(map);
    document.getElementById('btn-track-start').classList.add('recording');
    document.getElementById('track-btn-icon').textContent = '⏹';
    document.getElementById('track-btn-label').textContent = '記録停止';
    document.getElementById('track-info').classList.add('show');
  } else {
    isTracking = false;
    document.getElementById('btn-track-start').classList.remove('recording');
    document.getElementById('track-btn-icon').textContent = '⏺';
    document.getElementById('track-btn-label').textContent = '軌跡記録';
    document.getElementById('track-info').classList.remove('show');
    document.getElementById('gps-dot').className = 'active';
    if (currentTrackPoints.length > 1) {
      savedTracks.push({ points: [...currentTrackPoints], date: new Date().toLocaleDateString('ja-JP') });
      localStorage.setItem('keisyu_tracks', JSON.stringify(savedTracks));
      trackLayers.push(currentTrackLine);
    } else {
      if (currentTrackLine) map.removeLayer(currentTrackLine);
    }
    currentTrackLine = null;
    currentTrackPoints = [];
  }
}

// 全消去
function clearAll() {
  if (!confirm('全てのピンと軌跡を消去しますか？')) return;
  pins = []; savedTracks = [];
  localStorage.setItem('keisyu_pins', '[]');
  localStorage.setItem('keisyu_tracks', '[]');
  markers.forEach(m => map.removeLayer(m.marker)); markers = [];
  trackLayers.forEach(l => map.removeLayer(l)); trackLayers = [];
  if (currentTrackLine) { map.removeLayer(currentTrackLine); currentTrackLine = null; }
  currentTrackPoints = [];
  updateLogCount();
}

// ログ
function openLog() { renderLog(); document.getElementById('log-panel').classList.add('open'); }
function closeLog() { document.getElementById('log-panel').classList.remove('open'); }

function renderLog() {
  const list = document.getElementById('log-list');
  if (pins.length === 0) {
    list.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:10px 0">まだ記録がありません</div>';
    return;
  }
  list.innerHTML = [...pins].reverse().map(p => `
    <div class="log-item">
      <span class="log-badge badge-${p.type}">${typeLabel(p.type)}</span>
      <div class="log-info">
        <div class="log-name">${p.name}</div>
        <div class="log-meta">${p.date} ${p.time}</div>
        ${p.memo ? `<div class="log-memo">${p.memo}</div>` : ''}
        <button class="log-jump" onclick="jumpToPin(${p.lat},${p.lng})">地図で見る</button>
      </div>
      <button class="log-delete" onclick="deletePin(${p.id})">✕</button>
    </div>
  `).join('');
}

function jumpToPin(lat, lng) {
  closeLog();
  map.setView([lat, lng], 15);
}

function deletePin(id) {
  pins = pins.filter(p => p.id !== id);
  localStorage.setItem('keisyu_pins', JSON.stringify(pins));
  const idx = markers.findIndex(m => m.id === id);
  if (idx !== -1) { map.removeLayer(markers[idx].marker); markers.splice(idx, 1); }
  renderLog();
  updateLogCount();
}

function updateLogCount() {
  const el = document.getElementById('log-count');
  el.textContent = pins.length;
  el.style.display = pins.length > 0 ? 'flex' : 'none';
}

// 初期ロード
pins.forEach(p => addMarker(p));
savedTracks.forEach(t => {
  const l = L.polyline(t.points, { color:'#4a9e5c', weight:3, opacity:0.6, dashArray:'6,4' }).addTo(map);
  trackLayers.push(l);
});
updateLogCount();

// 初回現在地
navigator.geolocation && navigator.geolocation.getCurrentPosition(
  pos => map.setView([pos.coords.latitude, pos.coords.longitude], 13),
  () => {}
);
</script>
</body>
</html>
